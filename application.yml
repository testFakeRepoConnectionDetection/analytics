app:
  name: Analytics
  business_function: MIDDLE_OFFICE
  pillar: "Trading & Analytics"
  flow-enrichment:
    data-field: data
    frequency-field: frequency
  integrations:
    trading-pricing:
      base-url: https://trading-pricing.internal/api/v1/prices
      target-application: Trading/Pricing
      connection-kind: API
      channel: /api/v1/prices
      data: price
      frequency: real-time
    datahub:
      base-url: https://datahub.internal/api/v1/realtime-pv
      target-application: DataHub
      connection-kind: API
      channel: /api/v1/realtime-pv
      data: PV
      frequency: real-time
  api:
    trades:
      path: /api/v1/trades
      called-by-application: Trading/Pricing
      connection-kind: API
      data: trade
      frequency: real-time
  callers:
    - Trading/Pricing
